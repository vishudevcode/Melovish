name: Build Production Release APK

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Notes or version tag for this release build'
        required: false
        default: 'Production Release Build'

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: actions/setup-gradle@v3

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x gradlew

      - name: Decode and Restore Keystore File
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          # Decode the base64 secret and write it out as a physical JKS file
          echo "$KEYSTORE_BASE64" | base64 --decode > /tmp/release-key.jks
          echo "Keystore restored successfully to /tmp/release-key.jks"

      - name: Build Signed Release APK
        env:
          KEYSTORE_FILE_PATH: /tmp/release-key.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Securely Remove Keystore from Runner
        if: always()
        run: rm -f /tmp/release-key.jks

      - name: Upload Signed Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Melovish-Release-APK
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30
