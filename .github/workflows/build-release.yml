name: Build Production Release APK & Bundle (AAB)

on:
  workflow_dispatch: # Only runs when manually triggered by you

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Ensure Gradle Wrapper Executable
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          elif [ -f "gradlew" ]; then
            chmod +x gradlew
          else
            echo "Gradle wrapper not in root, falling back to installed gradle"
          fi

      - name: Decode and Restore Keystore File
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > /tmp/release-key.jks
          echo "Keystore restored successfully to /tmp/release-key.jks"

      - name: Build Signed Release APK & Bundle (AAB)
        env:
          KEYSTORE_FILE_PATH: /tmp/release-key.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleRelease bundleRelease --stacktrace
          else
            gradle assembleRelease bundleRelease --stacktrace
          fi

      - name: Securely Remove Keystore from Runner
        if: always()
        run: rm -f /tmp/release-key.jks

      - name: Stage Artifacts
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk dist/
          cp app/build/outputs/bundle/release/*.aab dist/

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Melovish-Production-Builds
          path: dist/*
          if-no-files-found: error
          retention-days: 30
