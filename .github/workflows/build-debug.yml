name: Build Debug APK

on:
  push:
    branches:
      - '**'        # Triggers automatically on every push to any branch
  workflow_dispatch: # Allows manual trigger from the Actions tab

jobs:
  build-debug:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Ensure Gradle Wrapper Executable
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          elif [ -f "gradlew" ]; then
            chmod +x gradlew
          else
            echo "Gradle wrapper not in root, falling back to installed gradle"
          fi

      - name: Assemble Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Stage Artifact
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk dist/

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Melovish-Debug-APK
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14
